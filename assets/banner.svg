<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background: #090d16; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8" />
    </linearGradient>

    <!-- Filter Effects -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="pillShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <style>
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1.5deg); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-1.5deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.45; transform: scale(1.08); }
      }
      @keyframes beamShimmer {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }

      .floating-tag-1 {
        animation: floatSlow1 7s ease-in-out infinite;
      }
      .floating-tag-2 {
        animation: floatSlow2 8.5s ease-in-out infinite;
      }
      .glow-orb-1 {
        transform-origin: 200px 100px;
        animation: pulseGlow 6s ease-in-out infinite;
      }
      .glow-orb-2 {
        transform-origin: 1000px 240px;
        animation: pulseGlow 8s ease-in-out infinite alternate;
      }
      .circuit-line {
        stroke-dasharray: 80 120;
        animation: beamShimmer 12s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGradient)" rx="16" />

  <!-- Background Grid Dots -->
  <g fill="#334155" opacity="0.35">
    <circle cx="80" cy="50" r="1.5" /><circle cx="160" cy="50" r="1.5" /><circle cx="240" cy="50" r="1.5" />
    <circle cx="320" cy="50" r="1.5" /><circle cx="880" cy="50" r="1.5" /><circle cx="960" cy="50" r="1.5" />
    <circle cx="1040" cy="50" r="1.5" /><circle cx="1120" cy="50" r="1.5" /><circle cx="80" cy="110" r="1.5" />
    <circle cx="160" cy="110" r="1.5" /><circle cx="1040" cy="110" r="1.5" /><circle cx="1120" cy="110" r="1.5" />
    <circle cx="80" cy="270" r="1.5" /><circle cx="160" cy="270" r="1.5" /><circle cx="1040" cy="270" r="1.5" />
    <circle cx="1120" cy="270" r="1.5" /><circle cx="80" cy="320" r="1.5" /><circle cx="160" cy="320" r="1.5" />
    <circle cx="240" cy="320" r="1.5" /><circle cx="320" cy="320" r="1.5" /><circle cx="880" cy="320" r="1.5" />
    <circle cx="960" cy="320" r="1.5" /><circle cx="1040" cy="320" r="1.5" /><circle cx="1120" cy="320" r="1.5" />
  </g>

  <!-- Dynamic Glowing Orbs in Background -->
  <circle class="glow-orb-1" cx="220" cy="90" r="180" fill="url(#glowGradient1)" filter="url(#glowFilter)" />
  <circle class="glow-orb-2" cx="980" cy="230" r="210" fill="url(#glowGradient2)" filter="url(#glowFilter)" />

  <!-- Animated Connection / Circuit Lines -->
  <path class="circuit-line" d="M 50 180 Q 250 80 400 180 T 800 180 T 1150 180" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.3" />
  <path class="circuit-line" d="M 50 220 Q 200 300 450 200 T 950 220 T 1150 130" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.2" />

  <!-- Animated Floating Ambient Badges (Sides & Corners, Not Overlapping Center Title) -->
  <g class="floating-tag-1" filter="url(#pillShadow)">
    <g transform="translate(60, 60)">
      <rect width="130" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.9" />
      <text x="65" y="21" fill="#38bdf8" font-size="12" font-weight="600" text-anchor="middle">⚡ Flutter</text>
    </g>
    <g transform="translate(80, 260)">
      <rect width="140" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.9" />
      <text x="70" y="21" fill="#60a5fa" font-size="12" font-weight="600" text-anchor="middle">⚛️ React Native</text>
    </g>
  </g>

  <g class="floating-tag-2" filter="url(#pillShadow)">
    <g transform="translate(1010, 60)">
      <rect width="130" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.9" />
      <text x="65" y="21" fill="#34d399" font-size="12" font-weight="600" text-anchor="middle">🦀 Tauri Mobile</text>
    </g>
    <g transform="translate(990, 260)">
      <rect width="140" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.9" />
      <text x="70" y="21" fill="#c084fc" font-size="12" font-weight="600" text-anchor="middle">🔋 Capacitor 8</text>
    </g>
  </g>

  <!-- Foreground Content (Solid, Clear, Prominently Centered) -->
  <g id="foreground-content">
    <!-- Top Category Pill -->
    <g transform="translate(600, 58)">
      <rect x="-135" y="-14" width="270" height="28" rx="14" fill="#1e1e38" stroke="#4f46e5" stroke-width="1.2" />
      <text x="0" y="5" fill="#a5b4fc" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">✨ CURATED FRAMEWORK MATRIX ✨</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="142" font-size="34" font-weight="800" text-anchor="middle" letter-spacing="-0.5" fill="url(#textGradient)">
      Hybrid Mobile App Development
    </text>

    <!-- Subtitle -->
    <text x="600" y="184" font-size="15" font-weight="400" fill="#cbd5e1" text-anchor="middle" opacity="0.95">
      The Complete Guide to Cross-Platform Engines, WebView Containers, Native Bridges &amp; Cloud Tooling
    </text>

    <!-- Feature Pillars -->
    <g transform="translate(600, 235)">
      <!-- Pill 1 -->
      <g transform="translate(-230, 0)">
        <rect x="-70" y="-15" width="140" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.95" />
        <text x="0" y="4" fill="#f1f5f9" font-size="11" font-weight="600" text-anchor="middle">📱 iOS &amp; Android</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(0, 0)">
        <rect x="-85" y="-15" width="170" height="30" rx="15" fill="#1e293b" stroke="#818cf8" stroke-width="1" opacity="0.95" />
        <text x="0" y="4" fill="#f1f5f9" font-size="11" font-weight="600" text-anchor="middle">🚀 Native Bridges &amp; OTA</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(230, 0)">
        <rect x="-75" y="-15" width="150" height="30" rx="15" fill="#1e293b" stroke="#c084fc" stroke-width="1" opacity="0.95" />
        <text x="0" y="4" fill="#f1f5f9" font-size="11" font-weight="600" text-anchor="middle">⚡ Open Source &amp; SaaS</text>
      </g>
    </g>
  </g>

  <!-- Bottom Accent Glowing Border -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#borderGlow)" />
  <!-- Corner Subtle Border Outline -->
  <rect x="0.5" y="0.5" width="1199" height="359" rx="15.5" fill="none" stroke="#334155" stroke-width="1" opacity="0.4" />
</svg>
